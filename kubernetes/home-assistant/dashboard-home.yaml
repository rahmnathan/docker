{
  "views": [
    {
      "title": "Home",
      "path": "home",
      "cards": [
        {
          "type": "custom:advanced-camera-card",
          "cameras": [
            {
              "camera_entity": "camera.picam2",
              "live_provider": "go2rtc",
              "title": "Picam 2"
            },
            {
              "camera_entity": "camera.octopi",
              "live_provider": "go2rtc",
              "title": "3D Printer"
            }
          ],
          "view": {
            "default": "live"
          },
          "live": {
            "display": {
              "mode": "grid",
              "grid_max_columns": 2
            }
          },
          "menu": {
            "style": "hover"
          }
        },
        {
          "type": "vertical-stack",
          "title": "Grapes",
          "cards": [
            {
              "type": "picture-entity",
              "entity": "image.grapes_avatar",
              "show_state": false,
              "show_name": true,
              "name": "Grapes"
            },
            {
              "type": "glance",
              "show_name": true,
              "show_icon": true,
              "show_state": true,
              "entities": [
                {
                  "entity": "sensor.grapes_today_s_fountain_drinking_count",
                  "name": "Drinks Today",
                  "icon": "mdi:cup-water"
                },
                {
                  "entity": "sensor.grapes_today_s_fountain_water_consumption",
                  "name": "Water Today",
                  "icon": "mdi:water"
                },
                {
                  "entity": "sensor.grapes_today_s_fountain_drinking_time",
                  "name": "Drink Time",
                  "icon": "mdi:clock"
                }
              ]
            }
          ]
        },
        {
          "type": "vertical-stack",
          "title": "Water Fountain",
          "cards": [
            {
              "type": "gauge",
              "entity": "sensor.dockstream_2_smart_fountain_remaining_water_2",
              "name": "Water Level",
              "min": 0,
              "max": 100,
              "severity": {
                "green": 50,
                "yellow": 25,
                "red": 10
              },
              "unit": "%"
            },
            {
              "type": "glance",
              "show_name": true,
              "show_icon": true,
              "show_state": true,
              "entities": [
                {
                  "entity": "sensor.dockstream_2_smart_fountain_remaining_filter_day",
                  "name": "Filter Days",
                  "icon": "mdi:filter"
                },
                {
                  "entity": "sensor.dockstream_2_smart_fountain_remaining_cleaning_days",
                  "name": "Clean Days",
                  "icon": "mdi:broom"
                },
                {
                  "entity": "sensor.dockstream_2_smart_fountain_today_s_water_consumption",
                  "name": "Used Today",
                  "icon": "mdi:water-outline"
                }
              ]
            },
            {
              "type": "entities",
              "entities": [
                {
                  "entity": "binary_sensor.dockstream_2_smart_fountain_water_dispensing_state",
                  "name": "Dispensing"
                },
                {
                  "entity": "select.dockstream_2_smart_fountain_water_dispensing_mode",
                  "name": "Mode"
                },
                {
                  "entity": "sensor.dockstream_2_smart_fountain_today_s_total_drinking_times",
                  "name": "Drinking Sessions Today"
                }
              ]
            },
            {
              "type": "horizontal-stack",
              "cards": [
                {
                  "type": "button",
                  "entity": "button.dockstream_2_smart_fountain_turn_on_indicator",
                  "name": "Light On",
                  "icon": "mdi:lightbulb-on",
                  "tap_action": {
                    "action": "toggle"
                  }
                },
                {
                  "type": "button",
                  "entity": "button.dockstream_2_smart_fountain_turn_off_indicator",
                  "name": "Light Off",
                  "icon": "mdi:lightbulb-off",
                  "tap_action": {
                    "action": "toggle"
                  }
                }
              ]
            }
          ]
        },
        {
          "type": "entities",
