            },
            {
              "type": "entities",
              "entities": [
                {
                  "entity": "sensor.airnow_reporting_station",
                  "name": "Station"
                },
                {
                  "entity": "sensor.airnow_pm2_5",
                  "name": "PM2.5"
                },
                {
                  "entity": "sensor.airnow_pm10",
                  "name": "PM10"
                },
                {
                  "entity": "sensor.airnow_ozone",
                  "name": "Ozone"
                }
              ]
            }
          ]
        },
        {
          "type": "vertical-stack",
          "title": "3D Printer",
          "cards": [
            {
              "type": "glance",
              "entities": [
                {
                  "entity": "sensor.octoprint_current_state",
                  "name": "State"
                },
                {
                  "entity": "sensor.octoprint_job_percentage",
                  "name": "Progress"
                },
