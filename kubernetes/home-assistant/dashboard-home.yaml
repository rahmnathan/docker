            {
              "type": "weather-forecast",
              "entity": "weather.nws_person_nathan_e0123",
              "show_current": true,
              "show_forecast": true,
              "forecast_type": "hourly"
            },
            {
              "type": "entities",
              "title": "NWS",
              "entities": [
                {
                  "entity": "weather.nws_person_nathan_e0123",
