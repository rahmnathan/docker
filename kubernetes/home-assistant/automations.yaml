- id: '1783876516769'
  alias: Disable detection when home
  description: Turn off detection and recording when arriving home
  triggers:
  - trigger: zone.entered
    target:
      entity_id: person.nathan
    options:
      behavior: each
      for: 00:00:00
      zone: zone.home
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.picam_detect
      - switch.picam2_detect
      - switch.picam3_detect
      - switch.octopi_detect
      - switch.picam_recordings
      - switch.picam2_recordings
      - switch.picam3_recordings
      - switch.octopi_recordings
    data: {}
  mode: single
- id: '1783876590820'
  alias: Enable detection when away
  description: Turn on detection and recording when leaving home
  triggers:
  - trigger: zone.left
    target:
      entity_id: person.nathan
    options:
      behavior: each
      for: 00:00:00
      zone: zone.home
  conditions: []
  actions:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.picam_detect
      - switch.picam2_detect
      - switch.picam3_detect
      - switch.octopi_detect
      - switch.picam_recordings
      - switch.picam2_recordings
      - switch.picam3_recordings
      - switch.octopi_recordings
    data: {}
  mode: single
- id: '1783901500001'
  alias: Notify on person detected
  description: Push notification with snapshot when person detected while away
  triggers:
  - trigger: mqtt
    topic: frigate/events
    payload: person
    value_template: '{{ value_json.after.label }}'
  conditions:
  - condition: state
    entity_id: person.nathan
    state: not_home
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''new'' }}'
  actions:
  - action: notify.mobile_app_phone
    data:
      title: Person Detected
      message: '{{ trigger.payload_json.after.camera | title }} camera'
      data:
        image: /api/frigate/notifications/{{ trigger.payload_json.after.id }}/snapshot.jpg
        tag: frigate-{{ trigger.payload_json.after.id }}
        clickAction: /lovelace/home
  mode: single
- id: '1783901500002'
  alias: Disable octopi detection while printing
  description: Avoid false alerts from printer movement
  triggers:
  - trigger: state
    entity_id: binary_sensor.octoprint_printing
    to: 'on'
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.octopi_detect
    data: {}
  mode: single
- id: '1783901500003'
  alias: Re-enable octopi detection after printing
  description: Turn detection back on when print finishes (if away)
  triggers:
  - trigger: state
    entity_id: binary_sensor.octoprint_printing
    to: 'off'
  conditions:
  - condition: state
    entity_id: person.nathan
    state: not_home
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.octopi_detect
    data: {}
  mode: single
- id: '1783901500004'
  alias: UPS on battery alert
  description: Notify when power goes out
  triggers:
  - trigger: state
    entity_id: sensor.serverups_status
    to: On Battery
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: ⚡ Power Outage
      message: UPS running on battery - {{ states('sensor.serverups_battery_charge')
        }}% remaining
      data:
        tag: ups-power
        priority: high
  mode: single
- id: '1783901500005'
  alias: UPS power restored
  description: Notify when power is restored
  triggers:
  - trigger: state
    entity_id: sensor.serverups_status
    from: On Battery
    to: Online
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: ✓ Power Restored
      message: UPS back on line power - {{ states('sensor.serverups_battery_charge')
        }}% battery
      data:
        tag: ups-power
  mode: single
- id: '1783901500006'
  alias: UPS low battery warning
  description: Critical alert when UPS battery is low
  triggers:
  - trigger: numeric_state
    entity_id: sensor.serverups_battery_charge
    below: 20
  conditions:
  - condition: state
    entity_id: sensor.serverups_status
    state: On Battery
  actions:
  - action: notify.mobile_app_phone
    data:
      title: "\U0001F534 UPS Battery Critical"
      message: Battery at {{ states('sensor.serverups_battery_charge') }}% - shutdown
        imminent!
      data:
        tag: ups-critical
        priority: high
  mode: single
- id: '1783901500007'
  alias: Notify on cat detected (Grapes)
  description: Push notification with snapshot when Grapes is detected while away
  triggers:
  - trigger: mqtt
    topic: frigate/events
    payload: cat
    value_template: '{{ value_json.after.label }}'
  conditions:
  - condition: state
    entity_id: person.nathan
    state: not_home
  - condition: template
    value_template: '{{ trigger.payload_json.type == ''new'' }}'
  actions:
  - action: notify.mobile_app_phone
    data:
      title: Grapes Spotted!
      message: '{{ trigger.payload_json.after.camera | title }} camera'
      data:
        image: /api/frigate/notifications/{{ trigger.payload_json.after.id }}/snapshot.jpg
        tag: frigate-cat-{{ trigger.payload_json.after.id }}
        clickAction: /lovelace/home
  mode: single
- id: '1783915899665'
  alias: High AQI Alert
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.airnow_air_quality_index
    for:
      hours: 0
      minutes: 5
      seconds: 0
    above: 100
  conditions: []
  actions:
  - action: notify.send_message
    metadata: {}
    target:
      device_id: 80e228866fe98d7d5ee0453b153aa56f
    data:
      message: Reconsider outdoor activity
      title: AQI Above 100
  mode: single
- id: '1783920000001'
  alias: High CO2 Alert
  description: Alert when indoor CO2 is high - open a window
  triggers:
  - trigger: numeric_state
    entity_id: sensor.apollo_air_1_506c08_co2
    above: 1000
    for:
      minutes: 5
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: 🌬️ CO2 High
      message: Indoor CO2 at {{ states('sensor.apollo_air_1_506c08_co2') }} ppm - consider opening a window
      data:
        tag: indoor-co2
  mode: single
- id: '1783920000002'
  alias: Very High CO2 Alert
  description: Critical alert when CO2 is very high
  triggers:
  - trigger: numeric_state
    entity_id: sensor.apollo_air_1_506c08_co2
    above: 1500
    for:
      minutes: 2
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: 🔴 CO2 Critical
      message: Indoor CO2 at {{ states('sensor.apollo_air_1_506c08_co2') }} ppm - ventilate immediately
      data:
        tag: indoor-co2
        priority: high
  mode: single
- id: '1783920000003'
  alias: High VOC Alert
  description: Alert when VOC levels indicate poor air quality
  triggers:
  - trigger: numeric_state
    entity_id: sensor.apollo_air_1_506c08_sen55_voc
    above: 250
    for:
      minutes: 10
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: ⚠️ High VOC Detected
      message: VOC index at {{ states('sensor.apollo_air_1_506c08_sen55_voc') }} - check for sources of fumes
      data:
        tag: indoor-voc
  mode: single
- id: '1783920000004'
  alias: High Indoor PM2.5 Alert
  description: Alert when indoor particulates are elevated
  triggers:
  - trigger: numeric_state
    entity_id: sensor.apollo_air_1_506c08_pm_2_5mm_weight_concentration
    above: 35
    for:
      minutes: 15
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: 😷 Indoor PM2.5 High
      message: PM2.5 at {{ states('sensor.apollo_air_1_506c08_pm_2_5mm_weight_concentration') }} µg/m³ - check air filter or close windows
      data:
        tag: indoor-pm25
  mode: single
- id: '1783930000001'
  alias: Aquarium Water Leak Alert
  description: Emergency alert and shutoff when water detected
  triggers:
  - trigger: state
    entity_id: binary_sensor.shellyfloodg4_e8f60a61d6a0_flood
    to: 'on'
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.aquarium_filter
    data: {}
  - action: notify.mobile_app_phone
    data:
      title: "🚨 Aquarium Water Leak!"
      message: "Water detected - filter has been shut off automatically"
      data:
        tag: aquarium-leak
        priority: high
  mode: single
- id: '1783930000002'
  alias: Aquarium Leak Resolved
  description: Notify when water is no longer detected
  triggers:
  - trigger: state
    entity_id: binary_sensor.shellyfloodg4_e8f60a61d6a0_flood
    to: 'off'
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: "✓ Aquarium Leak Cleared"
      message: "Water no longer detected. Filter remains OFF - turn on manually when safe."
      data:
        tag: aquarium-leak
  mode: single
- id: '1783930000003'
  alias: Aquarium Flood Sensor Low Battery
  description: Alert when flood sensor battery is low
  triggers:
  - trigger: numeric_state
    entity_id: sensor.shellyfloodg4_e8f60a61d6a0_battery
    below: 20
  conditions: []
  actions:
  - action: notify.mobile_app_phone
    data:
      title: "🔋 Aquarium Sensor Battery Low"
      message: "Flood sensor battery at {{ states('sensor.shellyfloodg4_e8f60a61d6a0_battery') }}%"
      data:
        tag: aquarium-battery
  mode: single
- id: '1783930000004'
  alias: Aquarium Light On Schedule
  description: Turn on aquarium light at 1:30pm PT (3:30pm CT) daily
  triggers:
